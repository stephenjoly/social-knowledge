services:
  social-knowledge:
    image: social-knowledge:local
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8787}:8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATA_DIR: /data
      VAULT_DIR: /vault
      MEDIA_DIR: /media
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in Dokploy}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in Dokploy}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_ANALYSIS_MODEL: ${OPENAI_ANALYSIS_MODEL:-gpt-5-mini}
      FACEBOOK_COOKIES_FILE: ${FACEBOOK_COOKIES_FILE:-/run/secrets/facebook-cookies.txt}
      INSTAGRAM_COOKIES_FILE: ${INSTAGRAM_COOKIES_FILE:-}
      FACEBOOK_IMPERSONATE: ${FACEBOOK_IMPERSONATE:-chrome-99}
      APP_URL: ${APP_URL:-http://localhost:8787}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      FETCH_COMMENTS: ${FETCH_COMMENTS:-false}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-1800}
      MAX_DOWNLOAD_BYTES: ${MAX_DOWNLOAD_BYTES:-524288000}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
    volumes:
      - social-knowledge-data:/data
      - social-knowledge-vault:/vault
      - social-knowledge-media:/media
      - type: bind
        source: ${FACEBOOK_COOKIES_HOST_PATH:?Set FACEBOOK_COOKIES_HOST_PATH}
        target: /run/secrets/facebook-cookies.txt
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: local

volumes:
  social-knowledge-data:
    external: true
    name: ${DATA_VOLUME_NAME:-social-knowledge-data}
  social-knowledge-vault:
    external: true
    name: ${VAULT_VOLUME_NAME:-social-knowledge-vault}
  social-knowledge-media:
    external: true
    name: ${MEDIA_VOLUME_NAME:-social-knowledge-media}
