services:
  social-knowledge:
    build:
      context: .
    image: social-knowledge:local
    container_name: social-knowledge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8787}:8787"
    env_file:
      - path: .env
        format: raw
    volumes:
      - ./data:/data
      - ./vault:/vault
      - ./media:/media
      # Optional authenticated extraction:
      # - ./secrets/cookies.txt:/run/secrets/social-cookies.txt:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: local
